services:
    # Hazelcast service
    hazelcast-server:
        image: hazelcast/hazelcast:latest
        container_name: hazelcast-server
        networks:
            - microservices-network
        restart: unless-stopped

        # kafka-server:
        #     image: bitnami/kafka:latest
        #     container_name: kafka-server
        #     environment:
        #         - BITNAMI_DEBUG=true
